<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-gap: 5px;
  }
  .cell {
    width: 100px;
    height: 100px;
    background-color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    cursor: pointer;
    border: 1px solid #ccc;
  }
  .controls {
    margin-top: 20px;
  }
  .controls button {
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="game">
  <h1>Tic-Tac-Toe</h1>
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <div class="controls">
    <button id="newGame">New Game</button>
  </div>
  <p id="turnInfo">Your turn (X)</p>
</div>

<script>
  const board = document.getElementById('board');
  const cells = board.querySelectorAll('.cell');
  const newGameButton = document.getElementById('newGame');
  const turnInfo = document.getElementById('turnInfo');
  let currentPlayer = 'X';
  let gameActive = true;
  const winConditions = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6]
  ];

  function checkWin() {
    for (let i = 0; i < winConditions.length; i++) {
      const [a, b, c] = winConditions[i];
      if (cells[a].textContent && cells[a].textContent === cells[b].textContent && cells[a].textContent === cells[c].textContent) {
        gameActive = false;
        alert(`${cells[a].textContent} wins!`);
        return;
      }
    }
    if ([...cells].every(cell => cell.textContent)) {
      gameActive = false;
      alert('Draw!');
    }
  }

  function cpuMove() {
    for (let i = 0; i < winConditions.length; i++) {
      const [a, b, c] = winConditions[i];
      if (cells[a].textContent === 'O' && cells[b].textContent === 'O' && !cells[c].textContent) {
        cells[c].textContent = 'O';
        checkWin();
        return;
      }
      if (cells[a].textContent === 'X' && cells[b].textContent === 'X' && !cells[c].textContent) {
        cells[c].textContent = 'O';
        checkWin();
        return;
      }
    }
    let emptyCells = [...cells].filter(cell => !cell.textContent);
    if (emptyCells.length > 0) {
      const randomIndex = Math.floor(Math.random() * emptyCells.length);
      emptyCells[randomIndex].textContent = 'O';
      checkWin();
    }
  }

  function handleCellClick(event) {
    const clickedCell = event.target;
    if (clickedCell.textContent || !gameActive) return;
    clickedCell.textContent = currentPlayer;
    checkWin();
    if (gameActive) {
      currentPlayer = 'O';
      turnInfo.textContent = "CPU's turn (O)";
      cpuMove();
      if (gameActive) {
        currentPlayer = 'X';
        turnInfo.textContent = "Your turn (X)";
      }
    }
  }

  function startGame() {
    cells.forEach(cell => cell.textContent = '');
    currentPlayer = 'X';
    gameActive = true;
    turnInfo.textContent = "Your turn (X)";
  }

  cells.forEach(cell => cell.addEventListener('click', handleCellClick));
  newGameButton.addEventListener('click', startGame);

  startGame();
</script>
</body>
</html>
